[package]
name = "gpui-agent"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[features]
gpui-pre-0-3-9 = []

[dependencies]
anyhow = "1"
async-channel = "2"
gpui = { package = "gpui-pre", version = "=0.3.8", features = ["render-to-image"] }
gpui-agent-protocol = { path = "../gpui-agent-protocol" }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
