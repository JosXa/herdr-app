name: patched Linux artifact
on:
  push:
    branches: [refresh-background]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.95.0
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config clang libclang-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libfontconfig-dev libfreetype-dev
      - run: |
          cargo build --release --locked
          mkdir -p dist/herdr-app
          cp target/release/herdr-app LICENSE THIRD-PARTY-NOTICES dist/herdr-app/
          cp assets/icons/herdr-ui-icon-clean.svg dist/herdr-app/herdr-app.svg
          tar -czf dist/herdr-app-linux-x86_64.tar.gz -C dist herdr-app
          sha256sum dist/herdr-app-linux-x86_64.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: herdr-app-linux-x86_64
          path: dist/herdr-app-linux-x86_64.tar.gz
          retention-days: 7
